name: Update returns and deploy Pages

on:
  schedule:
    # 22:00 UTC Mon–Fri = 06:00 Asia/Shanghai Tue–Sat.
    # In November the US cash close is 21:00 UTC, so this is after the session
    # is very likely in vendor databases.
    - cron: "0 22 * * 1-5"
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "data/returns.json"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Compute trailing total returns
        run: python scripts/update.py

      - name: Commit updated returns
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/returns.json
          if git diff --cached --quiet; then
            echo "returns.json unchanged"
            exit 0
          fi
          git commit -m "Update sector ETF trailing returns"
          git push origin HEAD:main

      - name: Assemble site
        run: |
          rm -rf _site
          mkdir -p _site/data
          cp index.html styles.css app.js .nojekyll _site/
          cp data/returns.json _site/data/returns.json
          test -f _site/.nojekyll
          test -f _site/data/returns.json
          python -c "import json; p=json.load(open('_site/data/returns.json')); assert len(p['rows'])==11, p; print(p['asOf'], p['source'])"

      - name: Ensure GitHub Actions Pages source
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/pages" -f build_type=workflow \
            || gh api --method PUT "repos/${GITHUB_REPOSITORY}/pages" -f build_type=workflow

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
